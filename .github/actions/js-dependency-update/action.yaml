name: Update NPM Dependencies
description: Checks if there are updates to NPM package, and creates a PR with the updated package*.json files.

inputs:

  base-branch:
    description: The branch used as the base for the dependency update Checks
    default: main
    required: false

  target-branch:
    description:  The target branch from which the PR is created
    default: update-dependencies
    required: false

  working-directory:
    description: the working directory of the project to check for depency updates
    required: true

  gh-token:
    description: Authentication token with repository access. Must have write access to contents and pull-request
    required: true

  debug:
    description: Wheter the output debug message to the console
    type: boolean
    default: 'false'


runs: 
  using: node24
  main: index.js