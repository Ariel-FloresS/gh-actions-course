name: 03-Worfows-Runners

on:
    push:

jobs:

    ubuntu-runner:

        runs-on: ubuntu-latest
        steps:
            - name: SHOW OS
              run: |
                echo "This job is running on Ubuntu"
                echo "Runner OS: $RUNNER_OS"

    windows-runner:

        runs-on: windows-latest
        steps:
            - name: SHOW OS
              shell: bash 
              run: | 
                echo "This job is running on Windows"
                echo "Runner OS: $RUNNER_OS" 

    mac-runner:

        runs-on: mac-latest
        steps:

            - name: SHOW OS
              shell: bash
              run: |
                echo "This job is running on Mac"
                echo "Runner OS: $RUNNER_OS" 


