name: 14 - Working with Artefacts 

on:
    workflow_dispatch:

env:
    build-artefact-key: app-${{ github.sha }}
    test-coverage-key: test-coverage-${{ github.sha}}


jobs:

    test-build:
        
        runs-on: ubuntu-latest
        defaults: 
            run:
                working-directory: 14-artefacts/react-app

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: '21.x'

            - name: Download cached Decpendencies
              uses: actions/cache@v3
              id: cache
              with:
                key: deps-node-modules-${{ hashFiles('14-artefacts/package.json')}}
                path: 14-artefacts/react-app/node_modules

            - name: Install dependencies 
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm install 
            
            - name: Unit Test
              run: npm run test -- --coverage

            - name: Upload test result
              uses: actions/upload-artifact@v4
              with:
                name: ${{env.test-coverage-key}}
                path: 14-artefacts/react-app/coverage

            - name: Build code
              run: npm run build

            - name: Upload build files
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.build-artefact-key }}
                path: 14-artefacts/react-app/build


    deploy:
        runs-on: ubuntu-latest
        needs: test-build

        steps:

            - name: Download Build artifact
              uses: actions/download-artifact@v4
              with:
                name: app
                path: build
            - name: Show folder structure
              run: ls -R
              