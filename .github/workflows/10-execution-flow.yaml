name: 10 - Execution - Flow 

on: 
    workflow_dispatch:

        inputs:
            pass-unit-test:
                type: boolean
                description: Whether unit test pass or not
                default: True
            
            

jobs:

    lint-build:
        runs-on: ubuntu-latest 
        steps:
            - name: Lint and Build
              run: echo "Linting and building project"


    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Running unit test
              run: echo "Runing unit test"

            - name: Failing test
              if: ${{ !inputs.pass-unit-test }}
              run: exit 1


    
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs: 
            - lint-build
            - unit-test
        steps:
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod..."
     
    load-test:
        runs-on: ubuntu-latest
        needs: 
            - deploy-nonprod
        steps:
            - name: Running load test
              run: echo "Running load test"

        
    e2e-tests:
        runs-on: ubuntu-latest
        needs: 
            - deploy-nonprod
        steps:
            - name: Running E2E test
              run: echo "Running E2E tests"


    deploy-prod:

        runs-on: ubuntu-latest
        needs: 
            - e2e-tests
            - load-test

        steps:
            - name: Deploy to Prod
              run: echo "Deploying to Prod"


    
    