name: 16 - Working With Environments


on:
    workflow_dispatch:
jobs:

    deploy-staging:

        runs-on: ubuntu-latest
        environment: staging
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Var
              run: |
                echo "Deploying to: ${{ env.my-env-value }}"

    e2e-test:

        runs-on: ubuntu-latest
        needs: deploy-staging
        steps:
            - name: E2E Tests
              run: echo "Running E2e"

    deploy-prod:

        runs-on: ubuntu-latest
        needs: e2e-test 
        environment: prod
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Var
              run: |
                echo "Deploying to: ${{ env.my-env-value }}"

