name: 04 - Using - Actions

on:
    push:

jobs:
    
    build:

        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: 04-using-actions/react-app

        # 0. Checkout the code from the repository
        # 1. install the dependencies of our reac aplications
        # 2. execute the automated test
        steps:
            - name: 0. Checkout code directory
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
                node-version: '20.x'
            - name: 1. Install dependencies
              run: npm install

            - name: 2. Run Unit Test
              run: npm run test

              
              
